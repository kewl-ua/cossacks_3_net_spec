[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c3net"
version = "0.1.0"
description = "Cossacks 3 lobby protocol and match stream: specification and parser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
c3net = "c3net.__main__:main"

[project.urls]
Specification = "https://github.com/kewl-ua/cossacks_3_server/blob/main/cossacks3-net.md"

[tool.setuptools]
packages = ["c3net"]
